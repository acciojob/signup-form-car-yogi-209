<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required placeholder="Name">
<br><br>
		<label for="email">Email</label>
		<input type="email" id="email" required placeholder="Email">
		<br><br
		<label for="gender">Gender:</label>
		<input type="Radio" id="male" required>
			<label for="male">male</label>
		<input type="Radio" id="female" required>
		<label for="female">Female</label>
		
		<br><br>

			<label for="cars">Car Brands</label>
		<select type="select" id="cars" required>
			<option value=" ">--Please choose an option--</option>
			<option value="swift">Swift</option>
			<option value="benz">Benz</option>
			<option value="BMW">BMW</option>
			<option value="Toyota">toyota</option>
			<option value="Supra">Supra</option>
		</select>
		<br><br>
			<label for="age">Age</label>
		<input type="number" id="age" required placeholder="Age">
		<br><br>
			<label for="dob">DOB</label>
		<input type="date" id="dob" required>
		<br>
<br>
			<label for="tel">Phone Number</label>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
		<br>

			<label for="password">Password</label>
		<input type="password" id="password" required placeholder="Password">
		<br><br>
			<label for="tos">I agree to the TOS</label>
		<input type="checkbox" id="tos" required>
		<br><br>

		<button type="submit" id="submit">Submit</button>

		
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>

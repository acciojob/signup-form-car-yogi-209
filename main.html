<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name</label>
		<input type="text" id="name" required placeholder="Name">
<br>
		<label for="email">Email</label>
		<input type="email" id="email" required placeholder="Email">
		<br>
		<label for="gender">Gender:</label>
		<input type="Radio" id="gender_m,gender_f" required>
			<label for="male">male</label>
		<input type="Radio" id="gender_f" required>
		<label for="female">Female</label>
		
		<br>

			<label for="cars">Car Brands</label>
		<input type="select" id="cars" required placeholder="--Please choose an option--">
		<br>
			<label for="age">Age</label>
		<input type="number" id="age" required placeholder="Age">
		<br>
			<label for="dob">DOB</label>
		<input type="date" id="dob" required>
		<br>

			<label for="tel">Phone Number</label>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx">
		<br>

			<label for="password">Password</label>
		<input type="password" id="password" required placeholder="Password">
		<br>
			<label for="tos">I agree to the TOS</label>
		<input type="checkbox" id="tos" required>
		<br>

		
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
